source: "README.md#how-to-interpret-the-parameter-choices"
status: "exploratory sensitivity assumptions for West Africa"
scope: "The submitted study uses published baseline values and a historical sensitivity screen. The ranges below document assumptions and do not prescribe additional fitting or experiments."

crop:
  tbase_c:
    prior_range: [9, 13]
    treatment: "mostly fixed; sensitivity"
  topt_c:
    prior_range: [24, 28]
    treatment: "mostly fixed; sensitivity"
  tsum_c_days:
    prior_range: [1192, 2906]
    treatment: "historical sensitivity across published Colombian regional anchors"
  rue_g_mj:
    prior_range: [0.5, 0.7]
    treatment: "fixed at the published baseline value in the relative response analysis"
  harvest_index:
    prior_range: [0.25, 0.35]
    treatment: "sensitivity around published 0.30"
  i50a_c_days:
    prior_range: [500, 900]
    treatment: "historical sensitivity"
  i50b_c_days:
    prior_range: [500, 900]
    treatment: "historical sensitivity"
  t_heat_c:
    prior_range: [32, 38]
    treatment: "stress sensitivity"
  t_extreme_c:
    prior_range: [38, 43]
    treatment: "stress sensitivity"
  i50max_h_c_days_per_day:
    prior_range: [0, 120]
    treatment: "high uncertainty"
  i50max_w_c_days_per_day:
    prior_range: [0, 120]
    treatment: "high uncertainty"
  swater:
    prior_range: [0.5, 2.5]
    treatment: "historical sensitivity only"
  co2_response:
    primary_sco2_per_ppm: 0.0
    treatment: "CO2-neutral primary scenarios approved; reported cacao CO2 RUE is not an S_CO2 coefficient"
    reported_cacao_table_value:
      label: "CO2 RUE"
      value: 0.09
      printed_unit: "degC"
      treatment: "retain as source metadata only; not mapped to model parameter"
    sensitivity:
      status: "not specified"
      treatment: "requires independent evidence and a justified response curve"

management_and_canopy:
  fsolar_max:
    prior_range: [0.65, 0.95]
    treatment: "fixed in the submitted analysis"
  initial_fsolar:
    prior_range: [0.005, 0.10]
    treatment: "replication or sensitivity"

notes:
  - "These priors are intentionally broad and must not be cited as direct West African cacao measurements."
  - "The published cacao application disabled drought stress. Nonzero swater is an exploratory historical sensitivity choice."
  - "The cacao table's CO2 RUE entry lacks a verified mapping to SIMPLE S_CO2; primary future scenarios use no CO2 response."
